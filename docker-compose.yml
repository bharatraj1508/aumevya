# Production compose for the VPS. MongoDB is external (Atlas or self-hosted),
# configured via MONGO_URI in .env. Values are read from .env in this directory.
services:
  web:
    build:
      context: .
      args:
        # Baked into the build: the client bundle AND the static robots.txt /
        # sitemap.xml / OG image. Compose interpolates this from the .env file
        # next to this compose file. It MUST be your public URL
        # (e.g. https://aumevya.com) — NOT the internal 127.0.0.1 bind address.
        # A runtime env_file value can't fix these; they're frozen at build time.
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    image: aumevya
    container_name: aumevya
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      # Bind-mount host media so existing uploads show and new uploads persist
      # on the VPS filesystem. Put your image files in ./media next to this file.
      - ./media:/app/media

  # One-off seeder/maintenance runner. Behind the "tools" profile so it never
  # starts with `docker compose up`. Runs the safe, idempotent courses seed:
  #   docker compose build          # rebuild after deploying new code
  #   docker compose --profile tools run --rm seeder
  # Run a different script by appending it, e.g.:
  #   docker compose --profile tools run --rm seeder npm run seed
  seeder:
    build:
      context: .
      target: seeder
    image: aumevya-seeder
    env_file: .env
    profiles: ["tools"]
    volumes:
      # Same media mount as web, so any uploaded files land on the host volume.
      - ./media:/app/media
